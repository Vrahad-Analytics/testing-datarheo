apiVersion: apps/v1
kind: Deployment
metadata:
  name: datarheo-backend
  namespace: datarheo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: datarheo-backend
  template:
    metadata:
      labels:
        app: datarheo-backend
    spec:
      containers:
      - name: backend
        image: your-registry/datarheo-backend:latest
        ports:
        - containerPort: 8000
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "8000"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: datarheo-secrets
              key: database-url
        - name: REDIS_URL
          value: "redis://datarheo-redis-master:6379"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: datarheo-secrets
              key: jwt-secret
        - name: FRONTEND_URL
          value: "https://datarheo.yourdomain.com"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: datarheo-backend
  namespace: datarheo
spec:
  selector:
    app: datarheo-backend
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
  type: ClusterIP
