apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: datarheo-ingress
  namespace: datarheo
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - datarheo.yourdomain.com
    - api.datarheo.yourdomain.com
    secretName: datarheo-tls
  rules:
  - host: datarheo.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: datarheo-frontend
            port:
              number: 3000
  - host: api.datarheo.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: datarheo-backend
            port:
              number: 8000
